name: Сборка APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PriceChecker-${{ github.run_number }}.apk"

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceChecker-apk
          path: out/*.apk
          retention-days: 30
